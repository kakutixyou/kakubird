<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>イベントポスター</title>
<style>
    /* 画面全体の基本設定 */
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        background-color: #e0e5ec;
        margin: 0;
        font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    /* ポスター本体のスタイル（A4比率に近いサイズ） */
    .poster-container {
        width: 420px;
        height: 594px;
        background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        border-radius: 10px;
        position: relative;
        overflow: hidden;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 40px 30px;
        box-sizing: border-box;
    }

    /* 背景のフワフワ動く装飾（アニメーション） */
    .circle {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        animation: float 6s infinite ease-in-out alternate;
    }
    .circle1 { width: 180px; height: 180px; top: -40px; left: -40px; }
    .circle2 { width: 280px; height: 280px; bottom: -60px; right: -60px; animation-delay: 2s; }

    @keyframes float {
        0% { transform: translateY(0) scale(1); }
        100% { transform: translateY(20px) scale(1.05); }
    }

    /* ヘッダー部分 */
    .header {
        text-align: center;
        z-index: 1;
    }

    /* ドクドク動く目立たせるタグ */
    .tag {
        background-color: #ff4757;
        color: white;
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 14px;
        font-weight: bold;
        display: inline-block;
        margin-bottom: 15px;
        animation: pulse 2s infinite;
        box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4);
    }

    @keyframes pulse {
        0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.7); }
        70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
        100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
    }

    /* タイトルとサブタイトル */
    .title {
        font-size: 34px;
        font-weight: 900;
        margin: 0 0 10px 0;
        line-height: 1.3;
        letter-spacing: 2px;
        text-shadow: 0 2px 5px rgba(0,0,0,0.3);
    }
    .subtitle {
        font-size: 16px;
        color: #d1d8e0;
        margin: 0;
    }

    /* 中央のメイングラフィック（ふわふわ浮く） */
    .main-graphic {
        flex-grow: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 90px;
        z-index: 1;
        text-shadow: 0 10px 20px rgba(0,0,0,0.4);
        animation: float 4s infinite ease-in-out alternate;
    }

    /* イベント詳細情報パネル */
    .details {
        background: rgba(255, 255, 255, 0.15);
        backdrop-filter: blur(10px); /* すりガラス効果 */
        padding: 20px;
        border-radius: 15px;
        z-index: 1;
        border: 1px solid rgba(255,255,255,0.2);
    }
    .detail-item {
        display: flex;
        margin-bottom: 12px;
        font-size: 15px;
        line-height: 1.4;
    }
    .detail-item:last-child {
        margin-bottom: 0;
    }
    .icon {
        margin-right: 15px;
        font-size: 18px;
    }

    /* フッター */
    .footer {
        text-align: center;
        margin-top: 20px;
        font-size: 12px;
        color: #a4b0be;
        z-index: 1;
    }
</style>
</head>
<body>

<div class="poster-container">
    <div class="circle circle1"></div>
    <div class="circle circle2"></div>

    <div class="header">
        <div class="tag">参加無料</div>
        <h1 class="title">未来創造<br>カンファレンス<br>2026</h1>
        <p class="subtitle">テクノロジーで世界を変える</p>
    </div>

    <div class="main-graphic">
        🚀
    </div>

    <div class="details">
        <div class="detail-item">
            <span class="icon">📅</span>
            <span>2026年 8月 15日 (土) 10:00 - 18:00</span>
        </div>
        <div class="detail-item">
            <span class="icon">📍</span>
            <span>東京ビッグサイト ホールA</span>
        </div>
        <div class="detail-item">
            <span class="icon">🎤</span>
            <span>AI、Web3、宇宙産業のトップランナー登壇</span>
        </div>
    </div>

    <div class="footer">
        詳細・お申し込みは Web サイトへ<br>
        www.example-future-conference.jp
    </div>
</div>

</body>
</html>
