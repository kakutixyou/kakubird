<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>VS Code AI Assistant</title>
  <style>
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background-color: #181818;
      color: #cccccc;
      padding: 16px;
      margin: 0;
    }
    .card {
      background: #202021;
      border: 1px solid #2b2b2b;
      border-left: 4px solid #0078d4;
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .badge {
      font-size: 11px;
      background: #0078d4;
      color: #fff;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }
    .title {
      font-size: 16px;
      font-weight: bold;
      color: #ffffff;
      margin: 4px 0 10px 0;
    }
    kbd {
      background: #2d2d2d;
      border: 1px solid #454545;
      border-bottom-width: 2px;
      border-radius: 4px;
      padding: 2px 6px;
      font-family: Consolas, monospace;
      font-size: 12px;
      color: #ce9178;
    }
    .action-bar {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .btn-exec {
      background: #0e639c;
      color: #ffffff;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-exec:hover {
      background: #1177bb;
    }
    code.cmd-preview {
      background: #121212;
      padding: 4px 8px;
      border-radius: 4px;
      font-family: Consolas, monospace;
      font-size: 12px;
      color: #4ec9b0;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    function renderAssistant(cards) {
      const app = document.getElementById('app');
      app.innerHTML = cards.map((item, idx) => {
        const cliCmd = item.cli_args ? `code ${item.cli_args.join(' ')}` : '';
        return `
          <div class="card">
            <div class="header">
              <span class="badge">${item.category || 'VS Code'}</span>
              ${item.shortcut_win ? `<span>ショートカット: <kbd>${item.shortcut_win}</kbd></span>` : ''}
            </div>
            <div class="title">${item.title}</div>
            <div>${item.description || ''}</div>
            ${cliCmd ? `
              <div class="action-bar">
                <code class="cmd-preview">${cliCmd}</code>
                <button class="btn-exec" onclick="triggerCommand('${cliCmd}')">
                  ⚡ コマンドを実行 / コピー
                </button>
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function triggerCommand(cmd) {
      navigator.clipboard.writeText(cmd);
      // Electron/バックエンド連携用のカスタムイベント発火
      window.dispatchEvent(new CustomEvent('vscode-cli-run', { detail: { command: cmd } }));
      alert(`コマンドをセットしました: ${cmd}`);
    }
  </script>
</body>
</html>
